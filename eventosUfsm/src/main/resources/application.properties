# Cloud Run injeta PORT dinamicamente; SERVER_PORT (usado em dev/docker-compose)
# tem prioridade quando definido, senão cai para PORT, senão 8080.
server.port=${SERVER_PORT:${PORT:8080}}
server.address=0.0.0.0
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventsDB}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT_SECRET é obrigatório (sem fallback): a app falha ao subir se não for
# definido, em vez de usar silenciosamente um segredo conhecido/versionado.
jwt.secret=${JWT_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.image-directory=${IMAGE_DIR:/tmp/images}
# Scrapper opcional — defaults vazios evitam falha de inicialização quando não configurado.
scrapper.script.path=${SCRAPPER_SCRIPT_PATH:}
scrapper.working.dir=${SCRAPPER_WORK_DIR:}

# Health check para Cloud Run. O grupo "liveness" não consulta o banco (só
# atesta que a JVM está viva); "readiness" inclui o indicador do banco.
# Exposto em GET /api/actuator/health/liveness — ver permitAll em SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=never