<ion-content [fullscreen]="true" class="auth-content">
  <div class="flex-center">
    <ion-card class="auth-card">
      <div class="auth-hero">
        <div class="logo-wrap">
          <ion-img src="assets/logo.png"></ion-img>
        </div>
        <h1 class="brand-title">SmartEventos</h1>
        <p class="brand-subtitle">Eventos da UFSM</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="login()">
        <ion-card-content class="auth-body">
          <ion-item lines="full" class="auth-field">
            <ion-input
              formControlName="email"
              type="email"
              label="E-mail"
              labelPlacement="floating"
              placeholder="seu@email.com"
              autocomplete="email">
            </ion-input>
          </ion-item>

          <ion-item lines="full" class="auth-field">
            <ion-input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              label="Senha"
              labelPlacement="floating"
              placeholder="Sua senha"
              autocomplete="current-password">
            </ion-input>
            <ion-button fill="clear" slot="end" (click)="togglePassword()" type="button" aria-label="Mostrar senha">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-item>

          <div class="auth-forgot">
            <a href="#">Esqueceu a senha?</a>
          </div>

          <ion-button expand="block" shape="round" type="submit" [disabled]="form.invalid" class="auth-submit">
            Entrar
          </ion-button>

          <p class="auth-switch">
            Sem conta? <a routerLink="/register">Cadastre-se aqui</a>
          </p>
        </ion-card-content>
      </form>
    </ion-card>
  </div>
</ion-content>
