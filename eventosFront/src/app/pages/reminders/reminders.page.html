<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Lembretes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Loading -->
  <div *ngIf="loading" class="reminders-loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <!-- Vazio -->
  <div *ngIf="!loading && reminders.length === 0" class="reminders-empty">
    <ion-icon name="alarm-outline"></ion-icon>
    <h3>Nenhum lembrete</h3>
    <p>Adicione lembretes nos eventos para não perder nada.</p>
  </div>

  <!-- Lista -->
  <ion-list *ngIf="!loading && reminders.length > 0" lines="none" class="reminders-list">
    <ion-card *ngFor="let reminder of reminders" class="reminder-card">
      <img
        [alt]="reminder.events?.eventName"
        [src]="reminder.events?.imgEvent"
        class="reminder-img"
        (click)="goToEventDetails(reminder.events?.eventsId)" />
      <ion-card-header>
        <ion-card-title>{{ reminder.events?.eventName }}</ion-card-title>
        <ion-card-subtitle>{{ reminder.events?.centerName }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content class="reminder-footer">
        <span class="reminder-time">
          <ion-icon name="time-outline"></ion-icon>
          {{ reminder.reminderTime | date: 'short' }}
        </span>
        <ion-button fill="clear" color="danger" (click)="deleteReminder(reminder.reminderId)" aria-label="Excluir lembrete">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-card-content>
    </ion-card>
  </ion-list>

</ion-content>
