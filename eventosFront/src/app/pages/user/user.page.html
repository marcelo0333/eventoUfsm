<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Cabeçalho do perfil -->
  <div class="profile-hero">
    <div class="profile-avatar">
      <span *ngIf="!userModel?.imgUser">{{ initials }}</span>
      <img *ngIf="userModel?.imgUser" [src]="userModel?.imgUser" alt="Foto de perfil" />
    </div>
    <h1 class="profile-name">{{ fullName || 'Usuário' }}</h1>
    <p class="profile-email">{{ userModel?.email }}</p>
    <ion-badge *ngIf="isAdmin" color="tertiary" class="profile-badge">Administrador</ion-badge>
  </div>

  <!-- Ações -->
  <ion-list inset="true" class="profile-actions">
    <ion-item button detail (click)="openEditModal()">
      <ion-icon name="create-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Editar perfil</ion-label>
    </ion-item>

    <ion-item *ngIf="isAdmin" button detail (click)="openCreateEventModal()">
      <ion-icon name="add-circle-outline" slot="start" color="secondary"></ion-icon>
      <ion-label>Criar evento</ion-label>
    </ion-item>

    <ion-item button detail (click)="logout()">
      <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
      <ion-label color="danger">Sair da conta</ion-label>
    </ion-item>
  </ion-list>

  <!-- Modal de edição -->
  <ion-modal [isOpen]="isModalOpen" (willDismiss)="closeModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Editar perfil</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeModal()">Fechar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <form [formGroup]="form" (ngSubmit)="edit()">
          <ion-item lines="full" class="auth-field">
            <ion-input formControlName="firstName" label="Nome" labelPlacement="floating"></ion-input>
          </ion-item>
          <ion-item lines="full" class="auth-field">
            <ion-input formControlName="lastName" label="Sobrenome" labelPlacement="floating"></ion-input>
          </ion-item>
          <ion-item lines="full" class="auth-field">
            <ion-input formControlName="email" type="email" label="E-mail" labelPlacement="floating"></ion-input>
          </ion-item>
          <ion-button expand="block" shape="round" type="submit" [disabled]="form.invalid" class="ion-margin-top">
            Salvar alterações
          </ion-button>
        </form>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
